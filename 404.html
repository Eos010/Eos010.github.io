      (() => {
        const WALLS = ["aurora", "dusk", "paper"];
        const NIGHT_FROM = 20; // 20:00 起算夜间
        const DAY_FROM = 6; // 06:00 起算白天

        /* 「同一段」的判定：凌晨 0-6 点仍属于前一天入夜的那一段，
           这样 23:00 手动切的主题不会在零点整莫名失效。 */
        function periodOf(now) {
          const hour = now.getHours();
          const anchor = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          if (hour < DAY_FROM) anchor.setDate(anchor.getDate() - 1);
          const night = hour >= NIGHT_FROM || hour < DAY_FROM;
          return {
            key: `${anchor.getFullYear()}-${anchor.getMonth() + 1}-${anchor.getDate()}-${night ? "night" : "day"}`,
            theme: night ? "dark" : "light",
          };
        }

        /* 手动选择只在「做出选择的那一段」内有效；跨过 20:00 / 06:00
           自动让位给时间规则，不必手动切回来。 */
        function readOverride(periodKey) {
          try {
            if (localStorage.getItem("cq-theme-period") !== periodKey) return null;
            const saved = localStorage.getItem("cq-theme");
            return saved === "dark" || saved === "light" ? saved : null;
          } catch {
            return null;
          }
        }

        function readWall() {
          try {
            const saved = localStorage.getItem("cq-wall");
            return WALLS.indexOf(saved) >= 0 ? saved : "aurora";
          } catch {
            return "aurora";
          }
        }

        function paint(theme, wall) {
          const root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.wall = wall;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === "dark" ? "#070a14" : "#e9ecf7";
        }

        function resolve() {
          const period = periodOf(new Date());
          return {
            theme: readOverride(period.key) ?? period.theme,
            wall: readWall(),
            period,
          };
        }

        window.__cqTheme = { periodOf, resolve, paint };

        const first = resolve();
        paint(first.theme, first.wall);

        /* 换页时 Astro 先清掉 <html> 上所有非 Astro 属性，再套用新文档的属性；
           而新文档是 fetch 来的，内联脚本不会执行 —— 不在这里盖章，
           data-theme / data-wall 每次换页都会丢，主题被打回默认。 */
        document.addEventListener("astro:before-swap", (event) => {
          const next = resolve();
          const html = event.newDocument.documentElement;
          html.dataset.theme = next.theme;
          html.dataset.wall = next.wall;
        });

        /* 页面一直开着跨过 20:00 / 06:00 时自动切换 */
        window.setInterval(() => {
          const next = resolve();
          if (document.documentElement.dataset.theme !== next.theme) paint(next.theme, next.wall);
        }, 60000);
      })();
